<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f1623">
  <meta name="description" content="在校园三维地图中浏览建筑、查询空间信息并规划出行路线。">
  <title>校园数字孪生地图平台 - 登录</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 44'%3E%3Cpath fill='%230f1623' d='M0 0h40v44H0z'/%3E%3Cpath d='M20 40S5 28 5 17a15 15 0 0 1 30 0c0 11-15 23-15 23Z' fill='none' stroke='%2363b3ed' stroke-width='2'/%3E%3Cpath d='M14 25V11h12v14M18 15h4m-4 5h4m-12 5h20' fill='none' stroke='%2363b3ed' stroke-width='2'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      color: #edf3fc;
      background: #0f1623;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }
    body { margin: 0; position: relative; isolation: isolate; min-width: 0; }
    button, input { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    button { cursor: pointer; }
    a { color: inherit; text-underline-offset: 4px; }

    body::before, body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      z-index: -2;
      background: #0f1623 url("./assets/login-bg.webp") 43% center / cover no-repeat;
    }

    body::after {
      z-index: -1;
      background:
        linear-gradient(180deg, rgba(9, 17, 29, .58) 0%, rgba(9, 17, 29, .08) 33%, rgba(9, 17, 29, .12) 50%, rgba(9, 17, 29, .94) 100%),
        linear-gradient(90deg, rgba(9, 17, 29, .24) 0%, rgba(9, 17, 29, .14) 42%, rgba(9, 17, 29, .76) 100%);
    }

    .page {
      min-height: 100vh;
      min-height: 100dvh;
      max-width: 1680px;
      margin: 0 auto;
      padding: 48px clamp(36px, 5vw, 80px) 24px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 420px;
      grid-template-rows: 1fr auto;
      gap: 30px clamp(48px, 7vw, 112px);
    }

    .brand-panel {
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 64px;
      padding: 4px 0 44px;
      animation: enter .45s ease-out both;
    }

    .brand-sign { display: flex; align-items: center; gap: 13px; }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 48px;
      height: 52px;
      color: #91cefa;
      border: 1px solid rgba(145, 206, 250, .35);
      border-radius: 13px;
      background: rgba(15, 26, 43, .64);
    }
    .brand-mark svg { width: 31px; height: 35px; }
    .brand-en { margin: 0; color: #c5d4e6; font-size: 11px; font-weight: 600; line-height: 1.8; letter-spacing: .19em; }
    .brand-note { display: block; color: #a4b9d1; font-size: 12px; letter-spacing: .04em; }
    .brand-copy { max-width: 650px; }
    h1 { margin: 0 0 17px; font-size: clamp(34px, 3.3vw, 52px); font-weight: 650; letter-spacing: .025em; line-height: 1.3; }
    .subtitle { margin: 0; color: #b9dcf8; font-size: 17px; line-height: 1.8; letter-spacing: .07em; }
    .description { margin: 18px 0 0; max-width: 450px; color: #b7c7da; font-size: 14px; line-height: 1.9; }
    .features { display: flex; flex-wrap: wrap; gap: 12px; padding: 0; margin: 25px 0 0; list-style: none; }
    .features li { display: flex; align-items: center; gap: 7px; color: #c0d0e3; font-size: 12px; line-height: 1.5; padding: 7px 11px; border: 1px solid rgba(158, 192, 226, .24); border-radius: 7px; background: rgba(18, 32, 50, .40); }
    .features svg { width: 15px; height: 15px; color: #8cc6f2; }

    .login-card {
      align-self: center;
      min-width: 0;
      padding: 34px;
      background: #1a2435;
      border: 1px solid rgba(160, 193, 227, .23);
      border-radius: 20px;
      box-shadow: 0 24px 70px rgba(4, 10, 20, .37), inset 0 1px 0 rgba(215, 234, 255, .04);
      animation: enter .45s .06s ease-out both;
    }
    @supports ((backdrop-filter: blur(20px)) or (-webkit-backdrop-filter: blur(20px))) {
      .login-card { background: rgba(24, 35, 53, .83); -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px); }
    }
    .form-header { margin-bottom: 28px; }
    .form-kicker { margin: 0 0 9px; color: #8ec8f2; font-size: 12px; line-height: 1.5; letter-spacing: .12em; }
    h2 { margin: 0; font-size: 27px; font-weight: 600; line-height: 1.4; letter-spacing: .03em; }
    .form-caption { margin: 10px 0 0; color: #a8b8ce; font-size: 13px; line-height: 1.7; }
    .input-group + .input-group { margin-top: 21px; }
    label { display: block; margin-bottom: 9px; color: #d1dceb; font-size: 13px; line-height: 1.5; }
    .field { position: relative; display: flex; align-items: center; height: 54px; border: 1px solid #4a5a71; border-radius: 10px; background: #111c2d; transition: border-color .16s, box-shadow .16s; }
    .field:focus-within { border-color: #63b3ed; box-shadow: 0 0 0 3px rgba(99, 179, 237, .2); }
    .field.invalid { border-color: #ee9fa5; }
    .field-icon { position: absolute; left: 15px; width: 18px; height: 18px; color: #8da7c4; pointer-events: none; }
    .field input { display: block; width: 100%; min-width: 0; height: 100%; padding: 0 14px 0 44px; color: #f1f5fc; font-size: 16px; border: 0; border-radius: inherit; background: transparent; outline: none; }
    .field input::placeholder { opacity: 1; color: #a3b4cc; }
    .password-field input { padding-right: 54px; }
    #passwordToggle { position: absolute; top: 4px; right: 4px; display: grid; place-items: center; width: 44px; height: 44px; padding: 0; color: #9cb3ce; border: 0; border-radius: 7px; background: transparent; transition: color .16s, background .16s; }
    #passwordToggle:hover { color: #cce8ff; background: rgba(99, 179, 237, .1); }
    #passwordToggle[aria-pressed="true"] { color: #91cefa; }
    #passwordToggle svg { width: 20px; height: 20px; }
    .eye-closed { display: none; }
    #passwordToggle[aria-pressed="true"] .eye-open { display: none; }
    #passwordToggle[aria-pressed="true"] .eye-closed { display: block; }
    button:focus-visible, a:focus-visible { outline: 2px solid #91cefa; outline-offset: 4px; }
    .error-tip { margin: 8px 0 0; color: #ffb2b8; font-size: 12px; line-height: 1.6; }
    .error-tip[hidden] { display: none; }
    #loginBtn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 52px; margin-top: 28px; padding: 12px 20px; color: #fff; border: 1px solid #3d87c7; border-radius: 10px; background: #2563a5; font-size: 16px; font-weight: 600; letter-spacing: .07em; box-shadow: 0 6px 20px rgba(20, 80, 142, .18); transition: background .16s, border-color .16s; }
    #loginBtn:hover { background: #2b6cb0; border-color: #79b9ed; }
    #loginBtn:active { background: #225b94; }
    #loginBtn:disabled { cursor: progress; opacity: .83; }
    .button-arrow { width: 18px; height: 18px; }
    .button-spinner { display: none; width: 17px; height: 17px; border: 2px solid rgba(255, 255, 255, .35); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
    #loginBtn.is-loading .button-spinner { display: block; }
    #loginBtn.is-loading .button-arrow { display: none; }
    .card-note { margin: 20px 0 0; color: #9aacbf; text-align: center; font-size: 12px; line-height: 1.7; }

    .site-footer { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 12px 24px; color: #a9b9cc; font-size: 12px; line-height: 1.8; }
    .site-footer p { margin: 0; }
    .footer-links { display: flex; flex-wrap: wrap; align-items: center; gap: 0 7px; }
    .site-footer a { color: #c0d1e5; text-decoration: none; }
    .site-footer a:hover { color: #91cefa; text-decoration: underline; }
    .site-footer a { display: inline-flex; align-items: center; min-height: 44px; }
    .demo-note { align-self: center; }
    .footer-divider { color: #768ba5; }

    @keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (min-width: 768px) and (max-width: 1099px) {
      .page { grid-template-columns: minmax(0, 1fr) 360px; gap: 24px 32px; padding: 34px 32px 20px; }
      .brand-panel { padding-bottom: 35px; }
      h1 { font-size: clamp(27px, 3.4vw, 34px); }
      .subtitle { font-size: 14px; letter-spacing: .02em; }
      .description { font-size: 13px; }
      .features { gap: 8px; }
      .features li { padding: 6px 8px; font-size: 11px; }
      .login-card { padding: 28px; }
      .site-footer { flex-wrap: wrap; gap: 0 20px; }
    }

    @media (max-width: 767px) {
      body::before { background-position: 37% 30%; }
      body::after { background: linear-gradient(180deg, rgba(9, 17, 29, .75), rgba(9, 17, 29, .58) 25%, rgba(9, 17, 29, .91) 100%); }
      .page { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto; align-content: center; gap: 20px; max-width: 480px; padding: 24px 20px 18px; }
      .brand-panel { padding: 0; gap: 17px; }
      .brand-sign { gap: 10px; }
      .brand-mark { width: 36px; height: 39px; border-radius: 10px; }
      .brand-mark svg { width: 24px; height: 28px; }
      .brand-en { font-size: 9px; letter-spacing: .15em; }
      .brand-note { font-size: 10px; }
      h1 { margin-bottom: 6px; font-size: 27px; letter-spacing: .015em; }
      .subtitle { font-size: 12px; letter-spacing: .025em; }
      .description, .features { display: none; }
      .login-card { padding: 25px 23px; border-radius: 16px; }
      .form-header { margin-bottom: 22px; }
      .form-kicker { display: none; }
      h2 { font-size: 23px; }
      .form-caption { margin-top: 7px; font-size: 12px; }
      .input-group + .input-group { margin-top: 18px; }
      label { margin-bottom: 8px; }
      .field { height: 52px; }
      #passwordToggle { top: 3px; right: 3px; }
      #loginBtn { margin-top: 23px; }
      .card-note { margin-top: 15px; font-size: 11px; }
      .site-footer { flex-direction: column; gap: 1px; text-align: center; font-size: 12px; line-height: 1.7; }
      .demo-note { max-width: 310px; }
      .footer-links { justify-content: center; }
    }

    @media (max-height: 640px) and (min-width: 768px) {
      .page { padding-top: 24px; padding-bottom: 14px; }
      .brand-panel { padding-bottom: 12px; }
      .login-card { padding-top: 25px; padding-bottom: 25px; }
      .form-header { margin-bottom: 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="brand-panel" aria-labelledby="pageTitle">
      <div class="brand-sign">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 44" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 40S5 28 5 17a15 15 0 0 1 30 0c0 11-15 23-15 23Z"/><path d="M14 25V11h12v14M18 15h4m-4 5h4m-12 5h20"/></svg>
        </span>
        <p class="brand-en">CAMPUS DIGITAL MAP<span class="brand-note">连接校园与空间</span></p>
      </div>
      <div class="brand-copy">
        <h1 id="pageTitle">校园数字孪生地图平台</h1>
        <p class="subtitle">三维浏览 · 空间查询 · 路径规划</p>
        <p class="description">在真实三维场景中浏览校园，<br>查询建筑信息，规划每一段路线。</p>
        <ul class="features" aria-label="平台功能">
          <li><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M4 17V5h8v12M12 9h4v8M2 17h16M7 8h2m-2 3h2m-2 3h2"/></svg>建筑属性</li>
          <li><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="m13 13 4 4M9 6v6M6 9h6"/></svg>范围检索</li>
          <li><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="4" cy="5" r="2"/><circle cx="16" cy="15" r="2"/><path d="M6 5h6a3 3 0 0 1 0 6H8a2 2 0 0 0 0 4h6"/></svg>多方式路线</li>
        </ul>
      </div>
    </section>

    <section class="login-card" aria-labelledby="loginTitle">
      <header class="form-header">
        <p class="form-kicker">欢迎使用</p>
        <h2 id="loginTitle">登录系统</h2>
        <p class="form-caption">使用演示账号，进入校园三维地图。</p>
      </header>
      <form id="loginForm" novalidate>
        <div class="input-group">
          <label for="username">账号</label>
          <div class="field">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg>
            <input type="text" id="username" name="username" placeholder="账号：admin" autocomplete="username" autocapitalize="none" spellcheck="false" aria-describedby="userError" aria-invalid="false">
          </div>
          <p class="error-tip" id="userError" role="alert" hidden></p>
        </div>
        <div class="input-group">
          <label for="password">密码</label>
          <div class="field password-field">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg>
            <input type="password" id="password" name="password" placeholder="密码：123456" autocomplete="current-password" aria-describedby="pwdError" aria-invalid="false">
            <button type="button" id="passwordToggle" aria-label="显示密码" aria-pressed="false" aria-controls="password" title="显示密码">
              <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12s3.5-7 9.5-7 9.5 7 9.5 7-3.5 7-9.5 7-9.5-7-9.5-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 3 18 18M10.5 5.1 12 5c6 0 9.5 7 9.5 7a18 18 0 0 1-3.2 4.3M6.3 6.3A19.4 19.4 0 0 0 2.5 12s3.5 7 9.5 7a9.9 9.9 0 0 0 4.1-.9M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
            </button>
          </div>
          <p class="error-tip" id="pwdError" role="alert" hidden></p>
        </div>
        <button type="submit" id="loginBtn" aria-busy="false">
          <span class="button-label">登录系统</span>
          <svg class="button-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg>
          <span class="button-spinner" aria-hidden="true"></span>
        </button>
        <p class="card-note">演示账号与密码见输入框提示</p>
      </form>
    </section>

    <footer class="site-footer">
      <p class="demo-note">前端演示系统 · 登录状态仅保存在当前浏览器</p>
      <p class="footer-links"><span>基于</span><a href="https://cesium.com/platform/cesiumjs/" target="_blank" rel="noopener noreferrer">CesiumJS</a><span class="footer-divider" aria-hidden="true">·</span><a href="https://github.com/lchangli/campus-digital-twin-map" target="_blank" rel="noopener noreferrer">GitHub 源码 ↗</a></p>
    </footer>
  </main>

  <script>
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const username = document.getElementById('username');
    const password = document.getElementById('password');
    const userError = document.getElementById('userError');
    const pwdError = document.getElementById('pwdError');
    const passwordToggle = document.getElementById('passwordToggle');
    const validUser = { username: 'admin', password: '123456' };
    let submitting = false;

    function clearErrors() {
      [username, password].forEach(input => {
        input.setAttribute('aria-invalid', 'false');
        input.closest('.field').classList.remove('invalid');
      });
      userError.hidden = true;
      pwdError.hidden = true;
      userError.textContent = '';
      pwdError.textContent = '';
    }

    function showError(input, message, text) {
      input.setAttribute('aria-invalid', 'true');
      input.closest('.field').classList.add('invalid');
      message.textContent = text;
      message.hidden = false;
    }

    username.addEventListener('input', clearErrors);
    password.addEventListener('input', clearErrors);

    passwordToggle.addEventListener('click', function () {
      const showPassword = password.type === 'password';
      password.type = showPassword ? 'text' : 'password';
      passwordToggle.setAttribute('aria-pressed', String(showPassword));
      passwordToggle.setAttribute('aria-label', showPassword ? '隐藏密码' : '显示密码');
      passwordToggle.title = showPassword ? '隐藏密码' : '显示密码';
    });

    loginForm.addEventListener('submit', function (event) {
      event.preventDefault();
      if (submitting) return;
      clearErrors();

      const userEmpty = username.value.trim() === '';
      const passwordEmpty = password.value.trim() === '';
      if (userEmpty) showError(username, userError, '用户名不能为空');
      if (passwordEmpty) showError(password, pwdError, '密码不能为空');
      if (userEmpty || passwordEmpty) {
        (userEmpty ? username : password).focus();
        return;
      }

      if (username.value !== validUser.username || password.value !== validUser.password) {
        showError(username, userError, '用户名或密码错误，请重新输入');
        password.setAttribute('aria-invalid', 'true');
        password.closest('.field').classList.add('invalid');
        username.focus();
        return;
      }

      const authenticatedUsername = username.value;
      submitting = true;
      loginBtn.disabled = true;
      loginBtn.classList.add('is-loading');
      loginBtn.setAttribute('aria-busy', 'true');
      loginBtn.querySelector('.button-label').textContent = '正在进入';
      setTimeout(() => {
        localStorage.setItem('isLogin', 'true');
        localStorage.setItem('username', authenticatedUsername);
        window.location.href = 'dashboard.html?v=cesium-1.145.0';
      }, 160);
    });

    window.addEventListener('pageshow', function (event) {
      if (!event.persisted) return;
      submitting = false;
      loginBtn.disabled = false;
      loginBtn.classList.remove('is-loading');
      loginBtn.setAttribute('aria-busy', 'false');
      loginBtn.querySelector('.button-label').textContent = '登录系统';
    });
  </script>
</body>

</html>
